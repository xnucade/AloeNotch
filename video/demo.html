<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AloeNotch — demo render</title>
<style>
/* =========================================================================
   AloeNotch demo video — stage styles.

   Everything here is STATIC styling only. No CSS transitions or animations:
   every time-varying property is written by timeline.js as a pure function of
   the current time, so a frame rendered at t is always identical. Adding a
   `transition:` anywhere in this file would desynchronise the render.

   Component metrics are copied from the real SwiftUI source so the recreation
   matches the shipping app. Where a number came from Swift, the origin is in
   a comment — keep them in sync if the app changes.
   ========================================================================= */

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 1920px;
  height: 1080px;
  overflow: hidden;
  background: #000;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased;
  color: #fff;
}

/* Rounded-design text (SwiftUI `design: .rounded`). */
.rounded { font-family: "SF Pro Rounded", ui-rounded, -apple-system, sans-serif; }
.mono-digit { font-variant-numeric: tabular-nums; }

#frame {
  position: relative;
  width: 1920px;
  height: 1080px;
  overflow: hidden;
  background: #000;
}

/* ---------- Camera -------------------------------------------------------
   Maps a point in virtual-screen coordinates to a point in the 1920x1080
   frame, so scenes can push in on a single column and pull back out.
   timeline.js writes the transform each frame. ------------------------- */
#camera {
  position: absolute;
  top: 0; left: 0;
  transform-origin: 0 0;
  will-change: transform;
}

/* ---------- Virtual Mac screen (1512x982 points, a 14" MacBook Pro) ---- */
#screen {
  position: relative;
  width: 1512px;
  height: 982px;
  overflow: hidden;
}

/* Procedural wallpaper — deliberately not a macOS system wallpaper, which is
   Apple artwork we cannot redistribute. */
#wallpaper { position: absolute; inset: 0; background: #05080f; }
#wallpaper .grad {
  position: absolute; inset: -20%;
  background:
    radial-gradient(60% 45% at 22% 8%,  rgba(52, 96, 168, 0.85), transparent 70%),
    radial-gradient(55% 50% at 82% 22%, rgba(28, 74, 140, 0.75), transparent 72%),
    radial-gradient(70% 60% at 50% 96%, rgba(6, 20, 44, 0.95), transparent 75%),
    linear-gradient(170deg, #0d2740 0%, #071426 55%, #04091a 100%);
  background-color: #071426;
}
#wallpaper .veil {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.05) 30%, rgba(0,0,0,0.45) 100%);
}
/* Soft silhouetted ridge along the bottom, so the desktop reads as a photo
   rather than a flat gradient. */
#wallpaper .ridge {
  position: absolute; left: 0; right: 0; bottom: 0; height: 46%;
  background: linear-gradient(180deg, transparent, rgba(2,6,16,0.92) 62%);
}

/* ---------- Menu bar --------------------------------------------------- */
#menubar {
  position: absolute; top: 0; left: 0; right: 0; height: 32px;
  display: flex; align-items: center;
  padding: 0 14px;
  font-size: 13px;
  color: rgba(255,255,255,0.92);
  z-index: 2;
}
#menubar .left { display: flex; align-items: center; gap: 17px; }
#menubar .left .app { font-weight: 700; }
#menubar .right { margin-left: auto; display: flex; align-items: center; gap: 15px; }
#menubar svg { display: block; }
#menubar .clock { font-size: 13px; letter-spacing: 0.1px; }

/* ---------- Notch panel ------------------------------------------------
   Geometry from NotchGeometry.swift / NotchRootView.swift:
     collapsed  = hardware notch size (200x32 here)
     expanded   = 616 x 208
     radius     = 26 expanded, 10 collapsed
     wings      = +46/side for the media glyph, +84/side for a HUD
   -------------------------------------------------------------------- */
#panelWrap {
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  z-index: 5;
}

/* Ambient glow lives OUTSIDE the panel's clip so its bloom can extend past
   the edge (NotchRootView.swift: `.background { AmbientGlow(...) }`). */
#glow { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; }
#glow .bloom { fill: none; stroke-width: 4; filter: blur(5px); }
#glow .line  { fill: none; stroke-width: 1.5; filter: blur(0.5px); }

#panel {
  position: relative;
  background: #000;
  overflow: hidden;      /* clip AFTER the frame, per the SwiftUI fix */
}

/* Hairline edge — sides and bottom only. Nothing light may touch the top or
   the hardware notch cutout stops being indistinguishable from the panel. */
#edge { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 6; }
#edge path { fill: none; stroke: rgba(255,255,255,0.09); stroke-width: 1; }

/* ---------- Collapsed content (wings) ---------------------------------- */
#collapsed {
  position: absolute; inset: 0;
  display: flex; align-items: center;
  padding: 0 9px;
}
#collapsed .side { flex: 1; display: flex; align-items: center; gap: 5px; }
#collapsed .side.right { justify-content: flex-end; }
#collapsed .deadzone { flex: 0 0 auto; }
#miniArt { width: 15px; height: 15px; border-radius: 4px; overflow: hidden; }

/* Equalizer glyph — heights [5,11,7,9], width 2.5, spacing 2 (NotchRootView). */
#wave { display: flex; align-items: center; gap: 2px; height: 12px; }
#wave i { display: block; width: 2.5px; border-radius: 2px; }

/* ---------- HUD content ------------------------------------------------ */
#hud {
  position: absolute; inset: 0;
  display: flex; align-items: center;
  padding: 0 12px;
}
#hud .side { flex: 1; display: flex; align-items: center; }
#hud .side.right { justify-content: flex-end; }
#hud .deadzone { flex: 0 0 auto; }
#hudBar { position: relative; width: 62px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.18); }
#hudBar b { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: rgba(255,255,255,0.92); }

/* ---------- Expanded content ------------------------------------------- */
#expanded {
  position: absolute; inset: 0;
  padding: 38px 18px 13px;   /* top = collapsed height (32) + 6 */
  display: flex; flex-direction: column; gap: 9px;
  transform-origin: top center;
}

.header { display: flex; align-items: center; gap: 9px; }
.header .clock { font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.85); }
.header .spacer { flex: 1; }
.pill {
  display: flex; align-items: center; gap: 5px;
  padding: 5px 9px; border-radius: 999px;
  background: rgba(255,255,255,0.08);
}
.pill .temp { font-size: 12px; font-weight: 600; }
.pill .pct  { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.85); }
.gear { color: rgba(255,255,255,0.55); display: flex; }

/* Battery glyph — 28x13 shell, 2px cap (BatteryView.swift). */
.batt { position: relative; width: 28px; height: 13px; }
.batt .shell { position: absolute; inset: 0; border: 1px solid rgba(255,255,255,0.5); border-radius: 3px; }
.batt .fill { position: absolute; top: 2px; bottom: 2px; left: 2px; border-radius: 2px; }
.batt .cap { position: absolute; right: -3px; top: 3.5px; width: 2px; height: 6px; border-radius: 1px; background: rgba(255,255,255,0.5); }

.body-row { flex: 1; display: flex; align-items: center; gap: 14px; min-height: 0; }
.divider { width: 1px; align-self: stretch; background: linear-gradient(180deg, transparent, rgba(255,255,255,0.14), transparent); }

/* Media column */
.media { flex: 1; display: flex; align-items: center; gap: 14px; min-width: 0; }
.art-stack { position: relative; width: 62px; height: 62px; flex: 0 0 auto; }
/* Artwork enlarged + blurred behind itself, casting color onto the panel. */
.art-stack .aura { position: absolute; inset: 0; transform: scale(1.35); filter: blur(22px); opacity: 0.55; border-radius: 13px; }
.art-stack .art { position: absolute; inset: 0; border-radius: 13px; overflow: hidden; box-shadow: 0 3px 6px rgba(0,0,0,0.35); }
.art-stack .badge {
  position: absolute; left: -5px; bottom: -5px; width: 20px; height: 20px;
  border-radius: 5px; overflow: hidden;
  box-shadow: 0 1px 2px rgba(0,0,0,0.4), inset 0 0 0 0.5px rgba(0,0,0,0.25);
  display: flex; align-items: center; justify-content: center;
}
/* Scoped to .media: an unscoped `.meta` also matches the end card's specs
   line, where `flex: 1` made it swallow all the free space. */
.media .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.media .meta .title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.media .meta .artist { font-size: 11px; color: rgba(255,255,255,0.7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.scrub { margin-top: 3px; display: flex; flex-direction: column; gap: 2px; }
.scrub .track { position: relative; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.15); }
.scrub .track b { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: rgba(255,255,255,0.85); }
.scrub .knob { position: absolute; top: 50%; width: 9px; height: 9px; border-radius: 50%; background: #fff; transform: translate(-50%, -50%); }
.scrub .times { display: flex; justify-content: space-between; font-size: 8.5px; color: rgba(255,255,255,0.45); }

.controls { display: flex; align-items: center; gap: 4px; padding-top: 1px; }
.controls .btn {
  width: 27px; height: 27px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: rgba(255,255,255,0.85);
}

/* Calendar column */
.cal { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.cal .top { display: flex; align-items: center; gap: 10px; }
.cal .month { font-size: 19px; font-weight: 700; }
.cal .days { display: flex; gap: 3px; }
.cal .day { width: 21px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.cal .day .dow { font-size: 8px; font-weight: 600; color: rgba(255,255,255,0.3); }
.cal .day .num { font-size: 13px; color: rgba(255,255,255,0.6); }
.cal .day.today .dow { color: #4799ff; }
.cal .day.today .num { color: #4799ff; font-weight: 700; }
.cal .sub { display: flex; align-items: center; gap: 5px; font-size: 10px; color: rgba(255,255,255,0.5); white-space: nowrap; }

/* Shelf column */
.shelf { flex: 0 0 150px; display: flex; flex-direction: column; gap: 6px; align-self: stretch; justify-content: center; }
.shelf .head { display: flex; align-items: center; gap: 6px; }
.shelf .head .label { font-size: 9.5px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: rgba(255,255,255,0.5); }
.shelf .head .sp { flex: 1; }
.shelf .head .dragall {
  display: flex; align-items: center; gap: 4px;
  padding: 3px 8px; border-radius: 999px; background: rgba(255,255,255,0.08);
  font-size: 9.5px; font-weight: 500; color: rgba(255,255,255,0.65);
  white-space: nowrap;
}
.shelf .head .trash { color: rgba(255,255,255,0.5); display: flex; }
.shelf .drop {
  position: relative; min-height: 62px; border-radius: 12px;
  border: 1px dashed rgba(255,255,255,0.14);
  display: flex; align-items: center; justify-content: center;
  padding: 6px;
}
.shelf .empty { display: flex; flex-direction: column; align-items: center; gap: 4px; color: rgba(255,255,255,0.4); font-size: 10px; }
.shelf .grid { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; }
.chip { width: 44px; height: 44px; border-radius: 7px; overflow: hidden; display: flex; align-items: center; justify-content: center; }

/* ---------- Cursor ------------------------------------------------------ */
#cursor { position: absolute; z-index: 40; width: 24px; height: 24px; pointer-events: none; }

/* A file being dragged toward the shelf. */
#dragGhost {
  position: absolute; z-index: 39; width: 52px; height: 52px;
  border-radius: 9px; overflow: hidden;
  box-shadow: 0 10px 26px rgba(0,0,0,0.55);
  display: flex; align-items: center; justify-content: center;
}

/* ---------- Overlays (outside the camera, so zooms don't move them) ----- */
#overlay { position: absolute; inset: 0; z-index: 60; pointer-events: none; }

#caption {
  position: absolute; left: 0; right: 0; bottom: 122px;
  text-align: center;
  font-size: 46px; font-weight: 600; letter-spacing: -0.6px;
  text-shadow: 0 2px 30px rgba(0,0,0,0.65);
}
#caption .sub {
  display: block; margin-top: 14px;
  font-size: 24px; font-weight: 400; letter-spacing: 0;
  color: rgba(245,245,247,0.62);
}

/* Full-bleed title / end cards. */
#card {
  position: absolute; inset: 0;
  background: #050507;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 26px;
}
#card .glowbed {
  position: absolute; width: 1100px; height: 1100px; border-radius: 50%;
  background: radial-gradient(circle, rgba(115,191,255,0.16), transparent 62%);
}
#card .icon { width: 148px; height: 148px; border-radius: 33px; overflow: hidden; position: relative; }
#card .wordmark { font-size: 92px; font-weight: 700; letter-spacing: -2.4px; position: relative; }
#card .tag { font-size: 30px; color: rgba(245,245,247,0.62); position: relative; }
#card .meta { font-size: 22px; color: rgba(245,245,247,0.38); position: relative; }
#card .url { font-size: 30px; color: #73bfff; position: relative; font-weight: 500; }
#card .rule { width: 92px; height: 2px; background: rgba(115,191,255,0.4); border-radius: 2px; position: relative; }
</style>
</head>
<body>

<div id="frame">
  <div id="camera">
    <div id="screen">
      <div id="wallpaper">
        <div class="grad"></div>
        <div class="ridge"></div>
        <div class="veil"></div>
      </div>

      <div id="menubar">
        <div class="left">
          <svg width="15" height="18" viewBox="0 0 14 17" fill="currentColor"><path d="M11.2 9c0-1.7 1.4-2.5 1.5-2.6-0.8-1.2-2.1-1.3-2.5-1.4-1.1-0.1-2.1 0.6-2.6 0.6-0.5 0-1.4-0.6-2.3-0.6-1.2 0-2.3 0.7-2.9 1.8-1.2 2.1-0.3 5.3 0.9 7 0.6 0.8 1.3 1.8 2.2 1.7 0.9 0 1.2-0.5 2.3-0.5 1 0 1.3 0.5 2.3 0.5 0.9 0 1.5-0.8 2.1-1.7 0.7-1 0.9-1.9 0.9-2-0.0-0-1.8-0.7-1.9-2.8zM9.5 3.6c0.5-0.6 0.8-1.4 0.7-2.2-0.7 0-1.6 0.5-2.1 1.1-0.5 0.5-0.9 1.4-0.7 2.2 0.8 0.1 1.6-0.4 2.1-1.1z"/></svg>
          <span class="app">Finder</span>
          <span>File</span><span>Edit</span><span>View</span><span>Go</span><span>Window</span><span>Help</span>
        </div>
        <div class="right">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="7"/><path d="M10 6.4v3.8l2.6 1.5"/></svg>
          <svg width="22" height="12" viewBox="0 0 26 13" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="0.6" y="0.6" width="21" height="11.8" rx="3"/><rect x="2.4" y="2.4" width="15" height="8.2" rx="1.6" fill="currentColor" stroke="none"/><path d="M23.4 4.4v4.2" stroke-linecap="round" stroke-width="2"/></svg>
          <svg width="17" height="13" viewBox="0 0 20 15" fill="currentColor"><path d="M10 13.4l2.1-2.4a3 3 0 0 0-4.2 0L10 13.4zM4.9 7.6a8 8 0 0 1 10.2 0l1.5-1.7a10.3 10.3 0 0 0-13.2 0l1.5 1.7zM1.6 3.9a13 13 0 0 1 16.8 0L20 2.2a15.3 15.3 0 0 0-20 0l1.6 1.7z"/></svg>
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="6.4"/></svg>
          <svg width="17" height="13" viewBox="0 0 20 15" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="0.8" y="0.8" width="18.4" height="13.4" rx="3"/><path d="M7 1v13.2"/></svg>
          <span class="clock">Sat 10:54 PM</span>
        </div>
      </div>

      <!-- The notch panel. -->
      <div id="panelWrap">
        <svg id="glow"><path class="bloom"></path><path class="line"></path></svg>
        <div id="panel">
          <div id="collapsed">
            <div class="side left"><div id="miniArt"></div></div>
            <div class="deadzone"></div>
            <div class="side right">
              <div id="wave"><i></i><i></i><i></i><i></i></div>
            </div>
          </div>

          <div id="hud">
            <div class="side left"><span id="hudIcon"></span></div>
            <div class="deadzone"></div>
            <div class="side right"><div id="hudBar"><b></b></div></div>
          </div>

          <div id="expanded">
            <div class="header">
              <span class="clock rounded mono-digit" id="hClock">10:54 PM</span>
              <span class="spacer"></span>
              <span class="pill" id="wxPill">
                <svg width="13" height="13" viewBox="0 0 20 20" fill="#c8d4e6"><path d="M14.6 12.6A6.4 6.4 0 0 1 7.4 5.4a5.2 5.2 0 0 0-1.3 1 6.4 6.4 0 0 0 9 9 5.2 5.2 0 0 0 1-1.3 6.4 6.4 0 0 1-1.5-1.5z"/></svg>
                <span class="temp rounded mono-digit">76&deg;</span>
              </span>
              <span class="pill">
                <span class="batt"><span class="shell"></span><span class="fill" id="battFill"></span><span class="cap"></span></span>
                <span class="pct rounded mono-digit" id="battPct">99%</span>
              </span>
              <span class="gear">
                <svg width="13" height="13" viewBox="0 0 20 20" fill="currentColor"><path d="M10 6.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8zm0 5.2a1.8 1.8 0 1 1 0-3.6 1.8 1.8 0 0 1 0 3.6z"/><path d="M17.3 11.6l-1.2-.7a6.6 6.6 0 0 0 0-1.8l1.2-.7a.8.8 0 0 0 .3-1.1l-1.1-1.9a.8.8 0 0 0-1.1-.3l-1.2.7a6.5 6.5 0 0 0-1.6-.9V3.5a.8.8 0 0 0-.8-.8H9.2a.8.8 0 0 0-.8.8v1.4a6.5 6.5 0 0 0-1.6.9l-1.2-.7a.8.8 0 0 0-1.1.3L3.4 7.3a.8.8 0 0 0 .3 1.1l1.2.7a6.6 6.6 0 0 0 0 1.8l-1.2.7a.8.8 0 0 0-.3 1.1l1.1 1.9a.8.8 0 0 0 1.1.3l1.2-.7c.5.4 1 .7 1.6.9v1.4a.8.8 0 0 0 .8.8h2.2a.8.8 0 0 0 .8-.8v-1.4c.6-.2 1.1-.5 1.6-.9l1.2.7a.8.8 0 0 0 1.1-.3l1.1-1.9a.8.8 0 0 0-.3-1.1z"/></svg>
              </span>
            </div>

            <div class="body-row">
              <div class="media">
                <div class="art-stack">
                  <div class="aura" id="artAura"></div>
                  <div class="art" id="artMain"></div>
                  <div class="badge" id="artBadge"></div>
                </div>
                <div class="meta">
                  <div class="title" id="mTitle">Neon Arcade</div>
                  <div class="artist" id="mArtist">Kade &amp; the Lantern</div>
                  <div class="scrub">
                    <div class="track"><b id="scrubFill"></b><span class="knob" id="scrubKnob"></span></div>
                    <div class="times mono-digit"><span id="tElapsed">1:20</span><span id="tTotal">3:24</span></div>
                  </div>
                  <div class="controls">
                    <span class="btn" id="btnPrev"><svg width="13" height="13" viewBox="0 0 20 20" fill="currentColor"><path d="M6 4.4a.9.9 0 0 0-.9.9v9.4a.9.9 0 0 0 1.8 0v-3.6l6.7 3.9a.9.9 0 0 0 1.4-.8V6.2a.9.9 0 0 0-1.4-.8L6.9 9.3V5.3a.9.9 0 0 0-.9-.9z"/></svg></span>
                    <span class="btn" id="btnPlay"></span>
                    <span class="btn" id="btnNext"><svg width="13" height="13" viewBox="0 0 20 20" fill="currentColor"><path d="M14 4.4a.9.9 0 0 1 .9.9v9.4a.9.9 0 0 1-1.8 0v-3.6l-6.7 3.9a.9.9 0 0 1-1.4-.8V6.2a.9.9 0 0 1 1.4-.8l6.7 3.9V5.3a.9.9 0 0 1 .9-.9z"/></svg></span>
                  </div>
                </div>
              </div>

              <div class="divider" id="div1"></div>

              <div class="cal">
                <div class="top">
                  <span class="month rounded">Jul</span>
                  <div class="days" id="calDays"></div>
                </div>
                <div class="sub">
                  <svg width="10" height="10" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="2.4" y="3.6" width="15.2" height="14" rx="2.6"/><path d="M2.4 8h15.2M6.6 1.8v3.2M13.4 1.8v3.2"/></svg>
                  <span id="calSub">Nothing for today</span>
                </div>
              </div>

              <div class="divider" id="div2"></div>

              <div class="shelf">
                <div class="head">
                  <span class="label">Shelf</span>
                  <span class="sp"></span>
                  <span class="dragall" id="dragAll">
                    <svg width="9" height="9" viewBox="0 0 20 20" fill="currentColor"><path d="M10 1.6 2.2 5.4 10 9.2l7.8-3.8L10 1.6z"/><path d="M2.2 9.6 10 13.4l7.8-3.8-2.3-1.1L10 11.1 4.5 8.5 2.2 9.6z"/><path d="M2.2 13.8 10 17.6l7.8-3.8-2.3-1.1L10 15.3l-5.5-2.6-2.3 1.1z"/></svg>
                    <span>Drag all</span>
                  </span>
                  <span class="trash" id="shelfTrash">
                    <svg width="10" height="10" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3.4 5.4h13.2M8 5.4V3.8h4v1.6M5 5.4l.8 11a1.4 1.4 0 0 0 1.4 1.3h5.6a1.4 1.4 0 0 0 1.4-1.3l.8-11"/></svg>
                  </span>
                </div>
                <div class="drop" id="shelfDrop">
                  <div class="empty" id="shelfEmpty">
                    <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.6 12.2v3.2a1.8 1.8 0 0 0 1.8 1.8h11.2a1.8 1.8 0 0 0 1.8-1.8v-3.2M10 2.6v8.6M6.6 8.2 10 11.6l3.4-3.4"/></svg>
                    <span>Drop files here</span>
                  </div>
                  <div class="grid" id="shelfGrid"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <svg id="edge"><path></path></svg>
      </div>

      <div id="dragGhost"></div>

      <svg id="cursor" viewBox="0 0 24 24">
        <path d="M5.5 2.6 18.4 13.1l-5.3.5 3 6.2-2.6 1.2-2.9-6.2-3.9 3.4z" fill="#fff" stroke="#000" stroke-width="1.1" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>

  <div id="overlay">
    <div id="caption"></div>
    <div id="card"></div>
  </div>
</div>

<script src="timeline.js"></script>
</body>
